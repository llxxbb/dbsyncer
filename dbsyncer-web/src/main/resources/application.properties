# 服务IP
server.ip=127.0.0.1
# 访问端口
server.port=18686

# 启用SSL配置(false-关闭; true-开启)
server.ssl.enabled=false
# 指定外部配置文件
server.ssl.key-store=conf/dbsyncer.p12
server.ssl.key-store-password=dbsyncer
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=dbsyncer

# 启用http端口(false-关闭; true-开启)
server.http.enabled=false
# server.ssl.enabled和server.http.enabled同时开启生效
server.http.port=8080
# 强制http重定向https端口(false-关闭; true-开启)
server.http.redirect=false

# 会话过期时间(秒)
server.servlet.session.timeout=1800
# 访问服务的路径，‘/’ -> http://${server.ip}:${server.port}/
server.servlet.context-path=/
spring.profiles.active=default



#storage
# 数据存储类型:disk(默认)/mysql(推荐生产环境使用)
# disk-磁盘:/data/config(驱动配置)|data(按驱动分别存储增量数据)|log(系统日志)
dbsyncer.storage.type=mysql
# dbsyncer.storage.mysql.url=jdbc:mysql://localhost:3306/dbsyncer?rewriteBatchedStatements=true&seUnicode=true&characterEncoding=UTF8&serverTimezone=Asia/Shanghai&useSSL=false&verifyServerCertificate=false&autoReconnect=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true
# dbsyncer.storage.mysql.username=root
# dbsyncer.storage.mysql.password=lxb
dbsyncer.storage.mysql.url=jdbc:mysql://192.168.172.24:6008/dbsyncer?rewriteBatchedStatements=true&seUnicode=true&characterEncoding=UTF8&serverTimezone=Asia/Shanghai&useSSL=false&verifyServerCertificate=false&autoReconnect=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true
dbsyncer.storage.mysql.username=test_user
dbsyncer.storage.mysql.password=test_password


sqlserver.ct.poll.interval.ms=500


#All < Trace < Debug < Info < Warn < Error < Fatal < OFF
logging.level.root=info
logging.level.org.dbsyncer.connector.mysql.cdc.MySQLListener=warn

