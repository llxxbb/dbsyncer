<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- ProjectGroup Connector Mapping -->
<div class="container-fluid">
    <div class="row">
        <form class="form-horizontal" role="form" method="post">

            <!-- 分组管理竖排显示 -->
            <div class="col-md-2" style="width: 280px; flex: 0 0 280px; max-width: 280px;">
                <!-- 分组管理竖排显示 -->
                <div class="panel panel-default">
                    <div class="panel-heading" style="text-align: left; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between;">
                        <h3 class="panel-title" style="margin: 0; font-size: 14px; white-space: nowrap;">分组管理</h3>
                        <button type="button" style="display: inline-block; margin-left: 8px; padding: 3px 6px; font-size: 11px; white-space: nowrap;" class="btn btn-default "
                            id="addProjectGroupBtn" th:if="${currentUser?.roleCode eq 'admin'}">
                            <span class="fa fa-plus"></span>添加分组([[${projectGroups?.size()} ?: 0]])
                        </button>
                    </div>
                    <div class="panel-body">
                        <div class="form-group">
                            <div class="btn-group-vertical" style="width: 100%;">
                                <style>
                                    .btn-group-vertical > div:hover > div {
                                        opacity: 1 !important;
                                    }
                                    .active-group-item {
                                        background-color: #e6e6e6;
                                        font-weight: bold;
                                    }
                                </style>
                                <div th:if="${currentUser?.roleCode eq 'admin'}" class="group-list-item" data-group-id="" style="display: flex; align-items: center; padding: 8px 15px; position: relative; border-bottom: 1px solid #e0e0e0; cursor: pointer;" th:classappend="${#strings.isEmpty(projectGroupId)} ? 'active-group-item'" title="未分配">
                                    <img th:src="@{/img/File.png}" style="width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0;" />
                                    <span style="vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;">&nbsp;未分配</span>
                                </div>
                                <div th:each="g,s:${projectGroups}" class="group-list-item"
                                    th:attr="data-group-id=${g?.id}"
                                    style="display: flex; align-items: center; padding: 8px 15px; position: relative; border-bottom: 1px solid #e0e0e0; cursor: pointer;"
                                    th:classappend="${g?.id eq projectGroupId} ? 'active-group-item'"
                                    th:title="${g?.name}">
                                    <img th:src="@{/img/File.png}"
                                        style="width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0;" />
                                    <span style="vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;">&nbsp;<span
                                        th:text="${g?.name}"></span></span>
                                    <div style="position: absolute; right: 0; top: 0; width: 40px; height: 100%; opacity: 0; transition: opacity 0.2s ease-in-out; z-index: 2;" th:if="${currentUser?.roleCode eq 'admin'}">
                                        <div class="dropdown" style="height: 100%;">
                                            <button type="button" class="btn dropdown-toggle"
                                                data-toggle="dropdown"
                                                style="padding: 6px 8px; margin: 0; width: 40px; height: 100%; border: none; background: transparent;">
                                                <span class="fa fa-ellipsis-v"></span>
                                            </button>
                                             <ul class="dropdown-menu dropdown-menu-right" style="min-width: 80px; width: auto;">
                                                  <li><a href="javascript:;"
                                                           th:attr="onclick=|doEditProjectGroup('${g?.id}')|"
                                                           style="padding: 5px 10px;">
                                                         <span class="fa fa-pencil"></span> 修改</a></li>
                                                  <li><a href="javascript:;"
                                                           th:attr="onclick=|doRemoveProjectGroup('${g?.id}')|"
                                                           style="padding: 5px 10px;">
                                                          <span class="fa fa-times"></span> 删除</a></li>
                                             </ul>
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" th:value="${projectGroupId}" th:name="projectGroup"
                                    id="projectGroup">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-10" style="flex: 1; max-width: calc(100% - 280px);">
                <!-- 任务面板（TaskPanel 组件渲染） -->
                <div id="taskPanel" th:if="${connectorSize gt 0}"></div>
                <input type="hidden" id="isAdmin" th:value="${currentUser?.roleCode eq 'admin'}" />
            </div>

        </form>
    </div>
</div>

<!-- 共享模板 -->
<div th:replace="shared/task-panel-templates :: taskPanelTemplates"></div>
<div th:replace="shared/task-list-templates :: taskListTemplates"></div>
<div th:replace="shared/task-card-templates :: taskCardTemplates"></div>
<!-- 共享组件 -->
<script th:src="@{/js/shared/task-list.js}"></script>
<script th:src="@{/js/shared/task-card-list.js}"></script>
<script th:src="@{/js/shared/task-toolbar.js}"></script>
<script th:src="@{/js/shared/task-panel.js}"></script>
<!-- 页面脚本 -->
<script th:src="@{/js/index/index.js}"></script>

</html>
