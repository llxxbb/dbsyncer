<div xmlns:th="http://www.thymeleaf.org" id="datasourcePage" th:fragment="page">
<!-- 页面专属样式：由 fragment 自带，避免污染外壳的全局 CSS（外壳已加载所有公共库与公共样式） -->
<link rel="stylesheet" type="text/css" th:href="@{/css/datasource/datasource.css}">

    <!-- 主体内容 -->
    <div class="container-fluid datasource-container">
        <!-- 左侧数据源列表 - 30%宽度 -->
        <div class="left-panel">
            <div class="left-header">
                <h2>数据源列表</h2>
                <button id="add-connector" class="btn btn-primary">添加数据源</button>
            </div>
            <div class="search-area">
                <select id="searchType" class="form-control search-type-select">
                    <option value="name" selected>数据源名称</option>
                    <option value="connectorType">数据源类型</option>
                    <option value="ip">IP地址</option>
                </select>
                <input type="text" id="searchInput" class="form-control search-input" placeholder="请输入搜索内容">
                <button id="searchBtn" class="btn btn-primary search-btn">搜索</button>
            </div>
            <div id="connector-list" class="connector-list-vertical">
                <!-- 数据源列表将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <!-- 右侧数据源详情 - 70%宽度 -->
        <div class="right-panel">
            <!-- 上半部分：数据源详细信息 -->
            <div id="connector-detail" class="connector-detail detail-section">
                <div class="no-connector-selected">
                    <p>请从左侧选择一个数据源或点击"添加数据源"按钮</p>
                </div>
                <!-- 数据源详情将通过JavaScript动态生成 -->
            </div>
                        
            <!-- 可拖拽分割线 -->
            <div class="resizer" id="resizer"></div>
            
            <!-- 下半部分：关联任务面板 -->
            <div id="related-drivers" class="drivers-section">
                <div class="drivers-header">
                    <h3>关联任务</h3>
                    <span class="drivers-count" style="margin-left:10px;color:#888;font-size:12px;"></span>
                </div>
                <div id="drivers-list" class="drivers-list">
                    <div class="no-drivers-selected">
                        <p>请从左侧选择一个数据源查看关联任务</p>
                    </div>
                    <!-- 任务面板将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>
</div>

<!--
    本页面是 SPA 内容片段，由外壳（public/index.html）加载并注入唯一内容容器。
    严禁在此重复引入 jQuery / Bootstrap / loading-plus / common.js 等公共库：
    那会重新初始化 jQuery 实例，抹掉外壳注册在其上的全部插件（$.loadingT、$.fn.serializeJson、
    $.fn.tableDnD 等），进而导致其它页面脚本运行时抛异常、列表渲染为空。
    详见 ADR-0032。
-->
<!-- 共享模板 -->
<div th:replace="shared/task-panel-templates :: taskPanelTemplates"></div>
<div th:replace="shared/task-list-templates :: taskListTemplates"></div>
<div th:replace="shared/task-card-templates :: taskCardTemplates"></div>
<!-- 共享组件 -->
<script th:src="@{/js/shared/task-list.js}"></script>
<script th:src="@{/js/shared/task-card-list.js}"></script>
<script th:src="@{/js/shared/task-toolbar.js}"></script>
<script th:src="@{/js/shared/task-panel.js}"></script>
<!-- 页面脚本 -->
<script th:src="@{/js/datasource/datasource.js}"></script>
