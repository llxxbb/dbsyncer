<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 字段差异弹窗 Fragment -->
<div th:fragment="fieldDifferenceModal">
    <div class="modal fade" id="fieldDifferenceModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title">字段差异分析</h4>
                </div>
                <div class="modal-body">
                    <div id="fieldDifferenceContent">
                        <!-- 动态生成 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="fixTargetTableBtn">
                        <span class="fa fa-arrow-right"></span> 修复目标表
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 字段差异修复预览弹窗 -->
    <div class="modal fade" id="fieldDiffFixModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title">字段差异修复预览</h4>
                </div>
                <div class="modal-body">
                    <div id="fieldDiffFixWarning" class="alert alert-warning">
                    </div>
                    <div id="fieldDiffFixInfoContent">
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>生成的 SQL 语句：</label>
                        <pre id="fieldDiffFixSqlContent" style="max-height: 200px; overflow-y: auto; background-color: #f5f5f5; padding: 10px; border-radius: 4px;"></pre>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmFieldDiffFixBtn">
                        <span class="fa fa-check"></span> 确认执行
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
