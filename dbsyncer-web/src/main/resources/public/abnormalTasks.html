<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div th:fragment="abnormalTasks" class="contentDiv">
    <div class="container-fluid">
        <!-- 列表视图 -->
        <div id="listView" style="display:none;">
            <div class="panel panel-default">
                <div class="panel-body">
                    <table class="table table-hover table-striped" id="taskTable">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>状态</th>
                                <th>失败数</th>
                                <th>源</th>
                                <th>目标</th>
                                <th>读取/写入</th>
                            </tr>
                        </thead>
                        <tbody id="listViewBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/abnormalTasks.js}"></script>
</html>
